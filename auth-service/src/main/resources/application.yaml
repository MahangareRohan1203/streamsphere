server:
  port: 8081

app:
  cors:
    allowed-origins: "http://localhost:5173"

spring:
  application:
    name: auth-service
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{X-Correlation-ID}]"
